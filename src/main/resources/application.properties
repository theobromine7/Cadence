spring.application.name=cadence
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/cadence}
spring.datasource.username=${DATABASE_USER:cadence}
spring.datasource.password=${DATABASE_PASSWORD:cadence}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:56379}
spring.task.scheduling.pool.size=3
cadence.worker.enabled=${WORKER_ENABLED:true}
management.endpoints.web.exposure.include=health,info,metrics
server.shutdown=graceful
