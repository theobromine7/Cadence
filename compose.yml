services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cadence
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment: &environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/cadence
      DATABASE_USER: cadence
      DATABASE_PASSWORD: cadence
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WORKER_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    environment:
      <<: *environment
      WORKER_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
